<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passarela</title>
    <link rel="stylesheet" href="closet.css" />
    <link rel="stylesheet" href="../../components/footer.css" />
    <link rel="stylesheet" href="../../components/header.css" />
    <script src="../script.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main>
      <button>Add outfits</button>

      <section>
        <h2>My Outfits</h2>

        <article class="outfit-card">
          <img
            src="images/casual-outfit.jpg"
            alt="Casual outfit with a white shirt and jeans"
          />

          <h3>Casual Day</h3>

          <p>White T-Shirt</p>
          <p>Blue Jeans</p>
          <p>White Sneakers</p>

          <button>View Outfit</button>
          <button>Schedule Outfit</button>
        </article>

        <article class="outfit-card">
          <img
            src="images/work-outfit.jpg"
            alt="Work outfit with a blouse and black pants"
          />

          <h3>Work Outfit</h3>

          <p>White Blouse</p>
          <p>Black Pants</p>
          <p>Black Flats</p>

          <button>View Outfit</button>
        </article>
      </section>
    </main>
    <div id="footer"></div>
  </body>
</html>
