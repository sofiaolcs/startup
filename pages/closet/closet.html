<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passarela</title>
    <link rel="stylesheet" href="closet.css" />
    <link rel="stylesheet" href="../../components/footer.css" />
    <link rel="stylesheet" href="../../components/header.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main>
      <a href="../create-outfit/create-outfit.html" class="button"
        >Create outfit</a
      >
      <a href="../clothes/clothes.html" class="button">Add clothes</a>

      <section>
        <h1>My Closet</h1>

        <div class="outfits">
          <article class="outfit-card">
            <h2>Casual Day</h2>

            <p>White T-Shirt</p>
            <p>Blue Jeans</p>
            <p>White Sneakers</p>

            <div id="outfitCarousel1" class="carousel slide">
              <div class="carousel-inner">
                <div class="carousel-item active">
                  <img
                    src="../../images/clothes/top1.jpg"
                    class="d-block w-100"
                    alt="White T-Shirt"
                  />
                </div>

                <div class="carousel-item">
                  <img
                    src="../../images/clothes/skirt.jpg"
                    class="d-block w-100"
                    alt="Blue Jeans"
                  />
                </div>

                <div class="carousel-item">
                  <img
                    src="../../images/clothes/shoe2.png"
                    class="d-block w-100"
                    alt="Sneakers"
                  />
                </div>
              </div>

              <button
                class="carousel-control-prev"
                type="button"
                data-bs-target="#outfitCarousel1"
                data-bs-slide="prev"
              >
                <span class="carousel-control-prev-icon"></span>
              </button>

              <button
                class="carousel-control-next"
                type="button"
                data-bs-target="#outfitCarousel1"
                data-bs-slide="next"
              >
                <span class="carousel-control-next-icon"></span>
              </button>
            </div>
          </article>

          <article class="outfit-card">
            <h2>Work Outfit</h2>

            <p>White Blouse</p>
            <p>Black Pants</p>
            <p>Black Flats</p>

            <div id="outfitCarousel2" class="carousel slide">
              <div class="carousel-inner">
                <div class="carousel-item active">
                  <img
                    src="../../images/clothes/top.png"
                    class="d-block w-100"
                    alt="White T-Shirt"
                  />
                </div>

                <div class="carousel-item">
                  <img
                    src="../../images/clothes/pants.png"
                    class="d-block w-100"
                    alt="Blue Jeans"
                  />
                </div>

                <div class="carousel-item">
                  <img
                    src="../../images/clothes/bag.png"
                    class="d-block w-100"
                    alt="Sneakers"
                  />
                </div>
              </div>

              <button
                class="carousel-control-prev"
                type="button"
                data-bs-target="#outfitCarousel2"
                data-bs-slide="prev"
              >
                <span class="carousel-control-prev-icon"></span>
              </button>

              <button
                class="carousel-control-next"
                type="button"
                data-bs-target="#outfitCarousel2"
                data-bs-slide="next"
              >
                <span class="carousel-control-next-icon"></span>
              </button>
            </div>
          </article>
        </div>
      </section>
    </main>
    <div id="footer"></div>
  </body>
</html>
