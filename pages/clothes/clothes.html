<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passarela</title>
    <link rel="stylesheet" href="clothes.css" />
    <link rel="stylesheet" href="../../components/footer.css" />
    <link rel="stylesheet" href="../../components/header.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="../script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main>
      <section>
        <div class="buttons">
          <a href="../create-outfit/create-outfit.html" class="button"
            >Create outfit</a
          >
          <a href="../closet/closet.html" class="button">See outfits</a>
        </div>

        <form class="clothes-form">
          <label for="clothing-name">Name</label>
          <input
            type="text"
            id="clothing-name"
            name="clothing-name"
            placeholder="White T-Shirt"
            required
          />

          <label for="clothing-type">Type</label>
          <select id="clothing-type" name="clothing-type" required>
            <option value="">Select a type</option>
            <option value="top">Top</option>
            <option value="bottom">Bottom</option>
            <option value="dress">Dress</option>
            <option value="shoes">Shoes</option>
            <option value="outerwear">Outerwear</option>
            <option value="accessory">Accessory</option>
          </select>

          <label for="clothing-color">Color</label>
          <input
            type="text"
            id="clothing-color"
            name="clothing-color"
            placeholder="White"
            required
          />

          <label for="clothing-brand">Brand</label>
          <input
            type="text"
            id="clothing-brand"
            name="clothing-brand"
            placeholder="Example Brand"
          />

          <label for="clothing-image">Image</label>
          <input
            type="file"
            id="clothing-image"
            name="clothing-image"
            accept="image/*"
            required
          />

          <button type="submit">Add Clothing</button>
        </form>

        <h1>My Clothes</h1>

        <div class="clothes">
          <article>
            <h2>White Cardigan</h2>
            <p>Type: Top</p>
            <p>Color: White</p>
            <p>Brand: Example Brand</p>
            <img src="../../images/clothes/top1.jpg" alt="White cardigan" />
          </article>

          <article>
            <h2>Blue Jeans</h2>
            <p>Type: Bottom</p>
            <p>Color: Blue</p>
            <img src="../../images/clothes/pants2.jpg" alt="Blue jeans" />
          </article>
        </div>
      </section>
    </main>
    <div id="footer"></div>
  </body>
</html>
